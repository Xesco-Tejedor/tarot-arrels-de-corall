name: organize
on:
  push:
    paths:
      - '.github/workflows/organize.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p assets/cards
          git mv ./*.webp assets/cards/
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Mover imagenes a assets/cards"
          git push
