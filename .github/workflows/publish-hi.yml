name: publish-hi-res-cards
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 text into webp binaries
        run: |
          set -e
          cd hi-src
          for t in *.txt; do
            [ "$t" = "sha256sums.txt" ] && continue
            base64 -d "$t" > "../assets/cards/${t%.txt}.webp"
          done
      - name: Verify SHA-256 against manifest
        run: |
          set -e
          cd assets/cards
          sha256sum -c ../../hi-src/sha256sums.txt
      - name: Install Pillow
        run: python3 -m pip install --quiet Pillow
      - name: Verify dimensions 1000x1500 and full decodability
        run: |
          set -e
          for f in assets/cards/*.webp; do
            python3 -c "from PIL import Image; im=Image.open('$f'); im.load(); assert im.size==(1000,1500), (str(im.size),'$f'); print('$f', im.size, 'OK')"
          done
      - name: Commit binaries and remove staging
        run: |
          set -e
          git config user.name "Xesco-Tejedor"
          git config user.email "Xesco-Tejedor@users.noreply.github.com"
          git rm -rq hi-src
          git add assets/cards
          git diff --cached --quiet && echo "nothing to change" || (git commit -m "Naipes a mayor resolucion 1000x1500 (mismas ilustraciones, via verificada)" && git push)
